<div class="container mt-4">
  <div class="card border-danger shadow">
    <div class="card-header bg-danger text-white">
      <h3 class="mb-0">Delete Book</h3>
    </div>

    <div class="card-body">

      <div class="alert alert-warning">
        Are you sure you want to delete this book?
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Book ID</label>
        <input
          type="text"
          class="form-control"
          value="101"
          readonly
        />
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Book Title</label>
        <input
          type="text"
          class="form-control"
          value="Java Programming"
          readonly
        />
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Author</label>
        <input
          type="text"
          class="form-control"
          value="James Gosling"
          readonly
        />
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Price</label>
        <input
          type="text"
          class="form-control"
          value="599"
          readonly
        />
      </div>

      <button class="btn btn-danger">
        Delete Book
      </button>

      <button class="btn btn-secondary ms-2">
        Cancel
      </button>

    </div>
  </div>
</div>
