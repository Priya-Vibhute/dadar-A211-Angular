<form class="container border border-dark m-3 p-3" [formGroup]="formGroup" 
(ngSubmit)="onSubmit()">

    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Name</label>
        <input type="text" class="form-control" id="exampleFormControlInput1" formControlName="name" >

        <div *ngIf="formGroup.get('name')?.invalid  && (formGroup.get('name')?.dirty || formGroup.get('name')?.touched )">
              
            <div class="form-text text-danger" *ngIf="formGroup.get('name')?.hasError('required')"> Name is required</div>

             <div class="form-text text-danger" *ngIf="formGroup.get('name')?.hasError('minlength')"> Minimun 2 characters are required</div>


        </div>


    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">age</label>
        <input type="number" class="form-control" id="exampleFormControlInput1" formControlName="age">

         <div *ngIf="formGroup.get('age')?.invalid  && (formGroup.get('age')?.dirty || formGroup.get('age')?.touched )">
              
            <div class="form-text text-danger" *ngIf="formGroup.get('age')?.hasError('required')"> age is required</div>

             <div class="form-text text-danger" *ngIf="formGroup.get('age')?.hasError('min')"> Minimum age 5 is required</div>

               <div class="form-text text-danger" *ngIf="formGroup.get('age')?.hasError('max')">maximum is 100</div>

        </div>
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">password</label>
        <input type="text" class="form-control" id="exampleFormControlInput1" formControlName="password">

         <div *ngIf="formGroup.get('password')?.invalid  && (formGroup.get('password')?.dirty || formGroup.get('password')?.touched )">
              
            <div class="form-text text-danger" *ngIf="formGroup.get('password')?.hasError('required')"> password is required</div>

             <div class="form-text text-danger" *ngIf="formGroup.get('password')?.hasError('pattern')"> Minimum 6 characters are required : It should include 1 uppercase 1 small case and 1 digit</div>


             <div class="form-text text-danger" *ngIf="formGroup.get('password')?.hasError('commonPassword')"> Commonly used password</div>

        </div>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>

</form>
